name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Tags like v2.3.0 set the version the app reports and compares against when it checks for updates.
      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          "VERSION_ARG=$(if ($v) { "-p:Version=$v" })" >> $env:GITHUB_ENV

      - name: Publish
        run: dotnet publish Oversight/Oversight.csproj -c Release -r win-x64 -o out ${{ env.VERSION_ARG }}

      # Releases are signed in the sign job; this copy is for trying a build.
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: |
            out/Oversight.exe
            README.md
            LICENSE

  # Signs the exe through SignPath (free signing for open source, certificate by SignPath Foundation) so Smart App
  # Control and SmartScreen trust it. Needs the SIGNPATH_API_TOKEN secret and SIGNPATH_* variables (see
  # docs/signing.md); without them the release goes out unsigned.
  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.setup.outputs.ready }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned
          path: unsigned

      - name: Check for signing setup
        id: setup
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $ready = [bool]$env:TOKEN -and [bool]'${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          "ready=$($ready.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $ready) { "::warning::SignPath isn't set up, so the release is unsigned." }
          # Laid out the way the SignPath artifact configuration expects.
          New-Item -ItemType Directory -Force to-sign/win-x64 | Out-Null
          Copy-Item unsigned/out/Oversight.exe to-sign/win-x64/Oversight.exe

      - name: Upload for signing
        id: upload
        if: steps.setup.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: to-sign
          path: to-sign/

      # Release signing needs an approver to confirm the request in SignPath; this waits up to an hour for that.
      - name: Sign
        if: steps.setup.outputs.ready == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Check signature
        if: steps.setup.outputs.ready == 'true'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature signed/win-x64/Oversight.exe
          "$($s.Status) $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw "Oversight.exe isn't signed" }
          Copy-Item signed/win-x64/Oversight.exe to-sign/win-x64/Oversight.exe -Force

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path to-sign/win-x64/Oversight.exe, unsigned/README.md, unsigned/LICENSE -DestinationPath Oversight-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Oversight-win-x64
          path: Oversight-win-x64.zip

  linux:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      - name: Build AppImage
        run: |
          sudo apt-get update -q && sudo apt-get install -yq file
          bash tools/build-appimage.sh ${{ matrix.rid }} $VERSION_ARG

      # Hotkeys, the crosshair overlay, an XTest click, the focused app and settings.json, on a virtual X display with a window manager.
      - name: Self-test under Xvfb
        run: |
          sudo apt-get install -yq xvfb openbox libxtst6 libxi6 fonts-dejavu-core
          chmod +x Oversight-${{ matrix.rid }}.AppImage
          xvfb-run -a -s "-screen 0 1280x800x24" sh -c 'openbox & sleep 2; APPIMAGE_EXTRACT_AND_RUN=1 ./Oversight-${{ matrix.rid }}.AppImage --self-test'

      - uses: actions/upload-artifact@v4
        with:
          name: Oversight-${{ matrix.rid }}
          path: Oversight-${{ matrix.rid }}.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sign, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Oversight-*
          merge-multiple: true

      # The in-app updater refuses to install a download whose hash isn't listed here.
      - name: Checksums
        run: sha256sum Oversight-win-x64.zip Oversight-linux-*.AppImage > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Oversight-win-x64.zip
            Oversight-linux-*.AppImage
            SHA256SUMS.txt
          # The code signing policy has to be mentioned where people download signed builds.
          body: "${{ needs.sign.outputs.signed == 'true' && 'Windows build: free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).' || '' }}"
          generate_release_notes: true
