name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Tags like v2.3.0 set the version the app reports and compares against when it checks for updates.
      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          "VERSION_ARG=$(if ($v) { "-p:Version=$v" })" >> $env:GITHUB_ENV

      - name: Publish
        run: dotnet publish Oversight/Oversight.csproj -c Release -r win-x64 -o out ${{ env.VERSION_ARG }}

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/Oversight.exe, README.md, LICENSE -DestinationPath Oversight-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Oversight-win-x64
          path: Oversight-win-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Oversight-win-x64

      # The in-app updater refuses to install a download whose hash isn't listed here.
      - name: Checksums
        run: sha256sum Oversight-win-x64.zip > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Oversight-win-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
